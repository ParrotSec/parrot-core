# Parrot Hyprland wallpaper configuration.
#
# Copy this file to ~/.config/hypr/hyprpaper.conf to customize it as a user.
# The user file takes precedence over this system-wide fallback.
#
# List monitor names with:
#   hyprctl monitors
#
# A monitor value of * is the fallback for displays without a specific block.
# For per-monitor wallpapers add another block, for example:
#
#   wallpaper {
#       monitor = eDP-1
#       path = /home/parrot/Pictures/laptop.jpg
#       fit_mode = cover
#   }
#
# fit_mode accepts contain, cover, tile or fill.

wallpaper {
    monitor = *
    path = /usr/share/backgrounds/parrot-cyberpunk.jpg
    fit_mode = fill
}

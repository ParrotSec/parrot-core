# Parrot Hyprland idle timers. Timeouts are in seconds.
#
# User timers are read from ~/.config/hypr/hypridle.settings; this file is the
# default template used to generate the effective Hypridle configuration.

general {
    lock_cmd = /usr/bin/cyberpunk-lock
    before_sleep_cmd = /usr/bin/cyberpunk-lock
    after_sleep_cmd = /usr/bin/hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# @parrot-timeout: lock
# Lock the session after 10 minutes.
listener {
    timeout = 600
    on-timeout = /usr/bin/cyberpunk-lock
}

# @parrot-timeout: display
# Turn the display off after 15 minutes; wake it on activity.
listener {
    timeout = 900
    on-timeout = /usr/bin/hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = /usr/bin/hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# @parrot-timeout: suspend
# Suspend after 30 minutes.
listener {
    timeout = 1800
    on-timeout = /usr/bin/systemctl suspend
}

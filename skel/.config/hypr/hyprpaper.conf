# Your Hyprland wallpaper configuration.
#
# The Parrot default is loaded from /etc/xdg/hypr/hyprpaper.conf. This file
# only needs the wallpaper block you want to override.

source = /etc/xdg/hypr/hyprpaper.conf

# Example: override the fallback wallpaper for all monitors.
# wallpaper {
#     monitor = *
#     path = /home/USER/Pictures/wallpaper.jpg
#     fit_mode = cover
# }

# Example: set a different wallpaper for one monitor.
# wallpaper {
#     monitor = eDP-1
#     path = /home/USER/Pictures/laptop.jpg
#     fit_mode = cover
# }

# Your Hyprland wallpaper configuration.
#
# Edit the path below to use your own image. Use hyprctl monitors for monitor
# names, and add more wallpaper blocks for per-monitor wallpapers.
#
# fit_mode accepts contain, cover, tile or fill.

wallpaper {
    monitor = *
    path = /usr/share/backgrounds/parrot-cyberpunk.jpg
    fit_mode = fill
}
